# claude-bridge configuration. Copy to ~/.config/claude-bridge/config.toml.
# Every key is optional; the values below are the defaults unless noted.

[server]
# Loopback for local tools; 10.0.0.1 is docker0, which containers reach as
# host.docker.internal. Never bind 0.0.0.0.
hosts = ["127.0.0.1", "10.0.0.1"]          # default: ["127.0.0.1"]
port = 8320
# Bearer token clients must send. Required. chmod 600, keep outside any repo.
token_file = "~/.config/claude-bridge/token"

[claude]
binary = "claude"                            # resolved on PATH
default_model = "sonnet"                     # used when a request omits "model"
models = ["sonnet", "opus", "haiku", "claude-sonnet-5-5", "claude-opus-5-5", "claude-haiku-5-5"]
# Effort when a request sends no reasoning_effort. Empty = Claude Code's default.
default_effort = ""
timeout_seconds = 120
max_concurrency = 3                          # parallel claude processes
max_queue = 20                               # waiting requests before 503
# Fixed, empty working directory for every call (must stay empty).
workdir = "~/.local/share/claude-bridge/cwd"
# Built-in plugins Claude Code may report; any other plugin fails the call
# with 424 context_guard (see README "Isolation").
allowed_plugins = ["cc-plugin-agents-md", "cc-plugin-plugin-authoring"]

# Authentication — pick at most one; with none, the current `claude` login is used.
# Recommended: a separate long-lived token (from `claude setup-token`) and the
# bridge's own config dir, so bridge runs never write to your ~/.claude or
# ~/.claude.json (each run rewrites the config dir's state file + a backup).
config_dir = "~/.local/share/claude-bridge/claude-home"
oauth_token_file = "~/.config/claude-bridge/oauth-token"
# Pay-per-token API key instead of the subscription (adds --bare):
# api_key_file = "~/.config/claude-bridge/anthropic-api-key"

[quota]
# Persist the last rate-limit snapshot so a restart keeps an active block.
state_file = "~/.local/share/claude-bridge/state/quota.json"   # default: none

[quota.limits]
# Stop accepting calls once a window's utilization (percent) reaches its limit;
# reopen at the window's reset. Shared with your own Claude Code use.
five_hour = 80
seven_day = 90
